name: Deploy the websocket server

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.websocket
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-websocket:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Deploy to VM
        run: |
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@65.2.78.148 "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-websocket:${{ github.sha }} &&
            docker stop user_websocket || true &&
            docker rm user_websocket || true &&
            docker run --name user_websocket -d --restart unless-stopped -p 8081:8081 -e DATABASE_URL='${{ secrets.DATABASE_URL }}' ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-websocket:${{ github.sha }}
          "